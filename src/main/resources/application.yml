spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DATABASE_USERNAME:reservation}
    password: ${DATABASE_PASSWORD:reservation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true

server:
  port: ${PORT:8080}
  shutdown: graceful

reservation:
  events:
    max-seats-per-event: 20000
  bookings:
    hold-duration: 10m
    max-seats-per-booking: 6
    sweep:
      interval: PT5S
      batch-size: 500
  payments:
    reconcile:
      interval: PT30S
      after: PT1M
      batch-size: 100
    ledger:
      base-url: ${LEDGER_URL:http://localhost:8081}
      email: ${LEDGER_EMAIL:}
      password: ${LEDGER_PASSWORD:}
      merchant-account-id: ${LEDGER_MERCHANT_ACCOUNT_ID:}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
