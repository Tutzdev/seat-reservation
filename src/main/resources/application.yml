spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DATABASE_USERNAME:reservation}
    password: ${DATABASE_PASSWORD:reservation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: seat-reservation
      # A new consumer group reads the topic from the start: replaying is harmless, since events that are
      # not ours are skipped and the inbox drops the ones already applied.
      auto-offset-reset: earliest

server:
  port: ${PORT:8080}
  shutdown: graceful

reservation:
  security:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${TOKEN_TTL:1h}
    organizer-email: ${ORGANIZER_EMAIL:}
    organizer-password: ${ORGANIZER_PASSWORD:}
  events:
    max-seats-per-event: 20000
  bookings:
    hold-duration: 10m
    max-seats-per-booking: 6
    sweep:
      interval: PT5S
      batch-size: 500
  payments:
    reconcile:
      interval: PT30S
      after: PT1M
      batch-size: 100
    # wallet-ledger transfer events on Kafka settle payments as soon as the ledger posts them.
    # Off by default: without them the reconciler still settles every payment, only later.
    events:
      enabled: ${LEDGER_EVENTS_ENABLED:false}
      topic: ${LEDGER_EVENTS_TOPIC:ledger.transfers}
    ledger:
      base-url: ${LEDGER_URL:http://localhost:8081}
      email: ${LEDGER_EMAIL:}
      password: ${LEDGER_PASSWORD:}
      merchant-account-id: ${LEDGER_MERCHANT_ACCOUNT_ID:}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
