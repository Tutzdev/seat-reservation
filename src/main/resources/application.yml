spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DATABASE_USERNAME:reservation}
    password: ${DATABASE_PASSWORD:reservation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true

server:
  port: ${PORT:8080}
  shutdown: graceful

reservation:
  events:
    max-seats-per-event: 20000
  bookings:
    hold-duration: 10m
    max-seats-per-booking: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
