services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    volumes:
      - reservation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      retries: 10

  # The waiting room and the rate limits. Nothing in it outlives a sale, so it is not persisted.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Traces of this service and of wallet-ledger, at http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "16686:16686"
      - "4318:4318"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reservation
      DATABASE_USERNAME: reservation
      DATABASE_PASSWORD: reservation
      REDIS_URL: redis://redis:6379
      LEDGER_URL: ${LEDGER_URL:-http://host.docker.internal:8081}
      LEDGER_EMAIL: ${LEDGER_EMAIL:-}
      LEDGER_PASSWORD: ${LEDGER_PASSWORD:-}
      LEDGER_MERCHANT_ACCOUNT_ID: ${LEDGER_MERCHANT_ACCOUNT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ORGANIZER_EMAIL: ${ORGANIZER_EMAIL:-}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:-}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Every request locally; production samples 10% (the default).
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    # Lets the container reach a ledger running on the host, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      retries: 10

volumes:
  reservation-data:
