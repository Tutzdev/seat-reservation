services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    volumes:
      - reservation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reservation
      DATABASE_USERNAME: reservation
      DATABASE_PASSWORD: reservation
      LEDGER_URL: ${LEDGER_URL:-http://host.docker.internal:8081}
      LEDGER_EMAIL: ${LEDGER_EMAIL:-}
      LEDGER_PASSWORD: ${LEDGER_PASSWORD:-}
      LEDGER_MERCHANT_ACCOUNT_ID: ${LEDGER_MERCHANT_ACCOUNT_ID:-}
    # Lets the container reach a ledger running on the host, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      retries: 10

volumes:
  reservation-data:
